<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <style>
      .label { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; text-anchor: middle; letter-spacing: 2px; }
      .dark-circle { fill: #000000; fill-opacity: 0.35; }
      .currency { font-family: 'DejaVu Sans', 'Segoe UI', Arial, sans-serif; font-size: 56px; font-weight: 900; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <rect x="10" y="10" width="220" height="140" rx="14" fill="#DE2910" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
  <!-- Большая звезда -->
  <polygon points="60,40 63,48 72,48 65,53 68,61 60,56 52,61 55,53 48,48 57,48" fill="#FFDE00"/>
  <!-- Четыре малые звезды -->
  <polygon points="85,30 87,35 92,35 88,38 89,43 85,40 81,43 82,38 78,35 83,35" fill="#FFDE00"/>
  <polygon points="92,45 94,50 99,50 95,53 96,58 92,55 88,58 89,53 85,50 90,50" fill="#FFDE00"/>
  <polygon points="85,58 87,63 92,63 88,66 89,71 85,68 81,71 82,66 78,63 83,63" fill="#FFDE00"/>
  <polygon points="70,65 72,70 77,70 73,73 74,78 70,75 66,78 67,73 63,70 68,70" fill="#FFDE00"/>
  <circle cx="120" cy="78" r="42" class="dark-circle"/>
  <text x="120" y="84" class="currency">¥</text>
  <text x="120" y="135" class="label">CNY</text>
</svg>
