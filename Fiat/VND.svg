<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
<defs>
<filter id="shadow-vnd" x="-5%" y="-5%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/></filter>
<clipPath id="clip-vnd"><rect x="10" y="10" width="220" height="140" rx="14"/></clipPath>
<linearGradient id="folds-vnd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#000" stop-opacity="0.3"/><stop offset="15%" stop-color="#fff" stop-opacity="0.15"/><stop offset="35%" stop-color="#000" stop-opacity="0.25"/><stop offset="55%" stop-color="#fff" stop-opacity="0.1"/><stop offset="80%" stop-color="#000" stop-opacity="0.35"/><stop offset="100%" stop-color="#fff" stop-opacity="0.15"/></linearGradient>
<linearGradient id="vignette-vnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0.1"/><stop offset="50%" stop-color="#000" stop-opacity="0.0"/><stop offset="100%" stop-color="#000" stop-opacity="0.4"/></linearGradient>
<style>.label{font-family:'DejaVu Sans',Arial,sans-serif;font-size:13px;font-weight:600;fill:#fff;text-anchor:middle;letter-spacing:2px}.dark-circle{fill:#000;fill-opacity:0.45}.currency{font-family:'DejaVu Sans','Segoe UI',Arial,sans-serif;font-size:56px;font-weight:900;fill:#fff;text-anchor:middle;dominant-baseline:central}</style>
</defs>
<g filter="url(#shadow-vnd)">
<rect x="10" y="10" width="220" height="140" rx="14" fill="#DA251D"/>
