<rect x="10" y="10" width="220" height="140" fill="#DA251D"/>
<polygon points="120,35 127,58 152,58 131,72 139,96 120,82 101,96 109,72 88,58 113,58" fill="#FFFF00"/>
<rect x="10" y="10" width="220" height="140" fill="url(#folds-vnd)"/>
