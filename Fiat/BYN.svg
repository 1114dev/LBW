<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <style>
      .label { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; text-anchor: middle; letter-spacing: 2px; }
      .dark-circle { fill: #000000; fill-opacity: 0.35; }
      .currency { font-family: 'DejaVu Sans', 'Segoe UI', Arial, sans-serif; font-size: 56px; font-weight: 900; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <rect x="10" y="10" width="220" height="140" rx="14" fill="#CE1720" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
  <rect x="10" y="103" width="220" height="47" fill="#007C30"/>
  <!-- Белый орнамент слева -->
  <rect x="10" y="10" width="28" height="140" fill="#ffffff" fill-opacity="0.3"/>
  <line x1="24" y1="15" x2="24" y2="145" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  <line x1="34" y1="15" x2="34" y2="145" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <polygon points="24,30 30,35 24,40 18,35" fill="#ffffff" opacity="0.8"/>
  <polygon points="24,50 30,55 24,60 18,55" fill="#ffffff" opacity="0.8"/>
  <polygon points="24,70 30,75 24,80 18,75" fill="#ffffff" opacity="0.8"/>
  <polygon points="24,90 30,95 24,100 18,95" fill="#ffffff" opacity="0.8"/>
  <polygon points="24,110 30,115 24,120 18,115" fill="#ffffff" opacity="0.8"/>
  <circle cx="120" cy="78" r="42" class="dark-circle"/>
  <text x="120" y="84" class="currency">Br</text>
  <text x="120" y="135" class="label">BYN</text>
</svg>
