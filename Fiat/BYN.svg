<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <style>
      .card { fill:#fff; stroke:#e2e8f0; stroke-width:1.5; rx:10; }
      .symbol { font-family:'DejaVu Sans',Arial,sans-serif; font-size:20px; font-weight:bold; fill:#1e293b; text-anchor:middle; }
    </style>
  </defs>
  <rect width="120" height="80" rx="10" class="card" filter="url(#shadow)"/>
  <!-- Флаг Беларуси -->
  <rect x="15" y="20" width="36" height="40" fill="#CE1720"/>
  <rect x="15" y="48" width="36" height="12" fill="#007C30"/>
  <rect x="15" y="20" width="10" height="40" fill="#fff" opacity="0.25"/>
  <line x1="20" y1="25" x2="20" y2="55" stroke="#fff" stroke-width="2" opacity="0.9"/>
  <line x1="25" y1="25" x2="25" y2="55" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
  <text x="73" y="50" class="symbol">Br</text>
</svg>
