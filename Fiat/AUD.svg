<!-- 9. Австралия (Пропорции 1:2) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="400" height="200">
  <defs>
    <g id="star-7pt"><path d="M0,-25 L5.7,-8.5 L22.5,-11.1 L11.4,2.5 L19.5,19.1 L2.5,11.4 L-11.4,24.3 L-8.5,5.7 L-24.3,-2.5 L-7.2,-5.7 Z" fill="#fff"/></g>
    <g id="star-5pt"><polygon points="0,-12 3.5,-2.5 12.3,-2.5 5.2,3.3 7.9,12 0,6.6 -7.9,12 -5.2,3.3 -12.3,-2.5 -3.5,-2.5" fill="#fff"/></g>
  </defs>
  <rect width="1200" height="600" fill="#012169"/>
  <!-- Кантон (Юнион Джек) -->
  <g id="canton" transform="scale(0.5)">
    <path d="M0,0 L1200,600 M0,600 L1200,0" stroke="#fff" stroke-width="120"/>
    <path d="M0,0 L1200,600 M0,600 L1200,0" stroke="#C8102E" stroke-width="40"/>
    <path d="M0,0 L600,300 M1200,600 L600,300" stroke="#C8102E" stroke-width="40" stroke-dasharray="0 40 600 0"/>
    <path d="M600,300 L1200,0 M600,300 L0,600" stroke="#C8102E" stroke-width="40" stroke-dasharray="600 40 0 0"/>
    <path d="M600,0 V600 M0,300 H1200" stroke="#fff" stroke-width="200"/>
    <path d="M600,0 V600 M0,300 H1200" stroke="#C8102E" stroke-width="120"/>
  </g>
  <!-- Звезда Содружества -->
  <use href="#star-7pt" transform="translate(300, 450) scale(1.6)"/>
  <!-- Южный Крест -->
  <use href="#star-7pt" transform="translate(900, 105) scale(0.9)"/>
  <use href="#star-7pt" transform="translate(1032, 246) scale(0.9)"/>
  <use href="#star-7pt" transform="translate(900, 495) scale(0.9)"/>
  <use href="#star-7pt" transform="translate(768, 336) scale(0.9)"/>
  <use href="#star-5pt" transform="translate(954, 282)"/>
</svg>

