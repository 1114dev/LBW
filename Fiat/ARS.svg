<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
<defs>
<filter id="shadow-ars" x="-5%" y="-5%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/></filter>
<clipPath id="clip-ars"><rect x="10" y="10" width="220" height="140" rx="14"/></clipPath>
<linearGradient id="folds-ars" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#000" stop-opacity="0.3"/><stop offset="15%" stop-color="#fff" stop-opacity="0.15"/><stop offset="35%" stop-color="#000" stop-opacity="0.25"/><stop offset="55%" stop-color="#fff" stop-opacity="0.1"/><stop offset="80%" stop-color="#000" stop-opacity="0.35"/><stop offset="100%" stop-color="#fff" stop-opacity="0.15"/></linearGradient>
<linearGradient id="vignette-ars" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0.1"/><stop offset="50%" stop-color="#000" stop-opacity="0.0"/><stop offset="100%" stop-color="#000" stop-opacity="0.4"/></linearGradient>
<style>.label{font-family:'DejaVu Sans',Arial,sans-serif;font-size:13px;font-weight:600;fill:#fff;text-anchor:middle;letter-spacing:2px}.dark-circle{fill:#000;fill-opacity:0.45}.currency{font-family:'DejaVu Sans','Segoe UI',Arial,sans-serif;font-size:56px;font-weight:900;fill:#fff;text-anchor:middle;dominant-baseline:central}</style>
</defs>
<g filter="url(#shadow-ars)">
<rect x="10" y="10" width="220" height="140" rx="14" fill="#75AADB"/>
<g clip-path="url(#clip-ars)">
<rect x="10" y="10" width="220" height="140" fill="#75AADB"/>
<rect x="10" y="56.6" width="220" height="46.8" fill="#ffffff"/>
<circle cx="120" cy="80" r="18" fill="#F6B40E"/>
<circle cx="120" cy="80" r="12" fill="#ED1B2E"/>
<rect x="10" y="10" width="220" height="140" fill="url(#folds-ars)"/>
<rect x="10" y="10" width="220" height="140" fill="url(#vignette-ars)"/>
</g>
<rect x="10" y="10" width="220" height="140" rx="14" fill="none" stroke="#cbd5e1" stroke-width="1"/>
</g>
<circle cx="120" cy="78" r="42" class="dark-circle"/>
<text x="120" y="84" class="currency">$</text>
<text x="120" y="135" class="label">ARS</text>
</svg>
