<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <style>
      .label { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; text-anchor: middle; letter-spacing: 2px; }
      .dark-circle { fill: #000000; fill-opacity: 0.35; }
      .currency { font-family: 'DejaVu Sans', 'Segoe UI', Arial, sans-serif; font-size: 56px; font-weight: 900; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .star { fill: #ffffff; }
    </style>
    <clipPath id="card-clip">
      <rect x="10" y="10" width="220" height="140" rx="14" />
    </clipPath>
    <clipPath id="canton-clip">
      <rect x="10" y="10" width="110" height="70" />
    </clipPath>
  </defs>
  
  <!-- Card Background -->
  <rect x="10" y="10" width="220" height="140" rx="14" fill="#012169" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>

  <g clip-path="url(#card-clip)">
    <!-- Union Jack -->
    <g clip-path="url(#canton-clip)">
      <!-- White Saltire -->
      <line x1="10" y1="10" x2="120" y2="80" stroke="#ffffff" stroke-width="12" />
      <line x1="120" y1="10" x2="10" y2="80" stroke="#ffffff" stroke-width="12" />
      <!-- Red Saltire -->
      <line x1="10" y1="10" x2="120" y2="80" stroke="#E0162B" stroke-width="4" />
      <line x1="120" y1="10" x2="10" y2="80" stroke="#E0162B" stroke-width="4" />
      <!-- White Cross -->
      <line x1="65" y1="10" x2="65" y2="80" stroke="#ffffff" stroke-width="16" />
      <line x1="10" y1="45" x2="120" y2="45" stroke="#ffffff" stroke-width="16" />
      <!-- Red Cross -->
      <line x1="65" y1="10" x2="65" y2="80" stroke="#E0162B" stroke-width="10" />
      <line x1="10" y1="45" x2="120" y2="45" stroke="#E0162B" stroke-width="10" />
    </g>

    <!-- Commonwealth Star (7 points) -->
    <polygon class="star" points="65.00,97.00 68.12,108.51 79.07,103.78 72.02,113.40 82.55,119.01 70.63,119.49 72.81,131.22 65.00,122.20 57.19,131.22 59.37,119.49 47.45,119.01 57.98,113.40 50.93,103.78 61.88,108.51" />

    <!-- Southern Cross -->
    <!-- Alpha Crucis (7 points) -->
    <polygon class="star" points="175.00,116.67 176.74,123.06 182.82,120.43 178.90,125.78 184.75,128.89 178.13,129.16 179.34,135.68 175.00,130.67 170.66,135.68 171.87,129.16 165.25,128.89 171.10,125.78 167.18,120.43 173.26,123.06" />
    <!-- Beta Crucis (7 points) -->
    <polygon class="star" points="147.50,61.25 149.24,67.65 155.32,65.02 151.40,70.36 157.25,73.48 150.63,73.74 151.84,80.26 147.50,75.25 143.16,80.26 144.37,73.74 137.75,73.48 143.60,70.36 139.68,65.02 145.76,67.65" />
    <!-- Gamma Crucis (7 points) -->
    <polygon class="star" points="175.00,23.33 176.74,29.73 182.82,27.10 178.90,32.44 184.75,35.56 178.13,35.83 179.34,42.34 175.00,37.33 170.66,42.34 171.87,35.83 165.25,35.56 171.10,32.44 167.18,27.10 173.26,29.73" />
    <!-- Delta Crucis (7 points) -->
    <polygon class="star" points="202.50,52.50 204.24,58.90 210.32,56.27 206.40,61.61 212.25,64.73 205.63,64.99 206.84,71.51 202.50,66.50 198.16,71.51 199.37,64.99 192.75,64.73 198.60,61.61 194.68,56.27 200.76,58.90" />
    <!-- Epsilon Crucis (5 points) -->
    <polygon class="star" points="188.75,82.75 190.22,86.73 194.46,86.90 191.13,89.52 192.28,93.60 188.75,91.25 185.22,93.60 186.37,89.52 183.04,86.90 187.28,86.73" />
  </g>

  <!-- Central Overlay -->
  <circle cx="120" cy="78" r="42" class="dark-circle"/>
  <text x="120" y="84" class="currency">$</text>
  <text x="120" y="135" class="label">AUD</text>
</svg>
