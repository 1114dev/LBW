<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="flag-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="33%" stop-color="#fff"/>
      <stop offset="33%" stop-color="#0039A6"/>
      <stop offset="66%" stop-color="#0039A6"/>
      <stop offset="66%" stop-color="#D52B1E"/>
      <stop offset="100%" stop-color="#D52B1E"/>
    </linearGradient>
    <style>
      .card-bg { fill: url(#flag-grad); stroke: #cbd5e1; stroke-width: 1.5; }
      .outline { fill: none; stroke: #ffffff; stroke-width: 1.8; stroke-opacity: 0.9; stroke-linejoin: round; stroke-linecap: round; }
      .outline-fill { fill: #ffffff; fill-opacity: 0.12; }
      .symbol { font-family: 'DejaVu Sans', 'Segoe UI', Arial, sans-serif; font-size: 52px; font-weight: 900; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .symbol-outline { stroke: #ffffff; stroke-width: 2.5; paint-order: stroke fill; }
      .label { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; text-anchor: middle; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Карточка -->
  <rect x="10" y="10" width="220" height="140" rx="14" class="card-bg" filter="url(#card-shadow)"/>

  <!-- Контур России (упрощённый, с Крымом и Калининградом) -->
  <g>
    <!-- Основная территория -->
    <path class="outline-fill outline" d="
      M 58,30 
      C 65,26 78,24 90,25 
      C 100,26 110,22 122,20 
      C 140,18 158,20 170,26 
      C 180,32 186,42 188,56 
      C 190,70 186,86 175,100 
      C 164,112 150,120 138,126 
      C 126,132 112,138 100,138 
      C 88,138 78,136 68,128 
      C 58,120 52,108 50,92 
      C 48,76 50,58 55,42 
      Z
    "/>
    <!-- Крым -->
    <path class="outline-fill outline" d="
      M 142,108 
      C 138,106 136,102 140,98 
      C 144,94 152,92 156,96 
      C 160,100 156,106 150,110 
      Z
    "/>
    <!-- Калининградская область -->
    <path class="outline-fill outline" d="
      M 24,72 
      C 20,68 22,62 28,62 
      C 34,62 38,68 34,74 
      C 30,78 26,76 24,72 
      Z
    "/>
  </g>

  <!-- Символ рубля -->
  <text x="120" y="88" class="symbol symbol-outline">₽</text>

  <!-- Подпись RUB -->
  <text x="120" y="135" class="label">RUB</text>
</svg>
