<!-- 2. США (Исправленная точная геометрия) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 100" width="380" height="200">
  <defs>
    <!-- Размер звезды уменьшен до ~0.0616 от высоты флага для точного зазора -->
    <polygon id="us-star" points="0,-3.08 0.9,-0.92 3.08,-0.92 1.32,0.36 1.99,2.49 0,1.18 -1.99,2.49 -1.32,0.36 -3.08,-0.92 -0.9,-0.92" fill="#fff"/>
    <!-- Ряд из 6 звезд: шаг 6.33, центрирование внутри 76 единиц -->
    <g id="star-row-6">
      <use href="#us-star" x="6.33"/><use href="#us-star" x="19.00"/><use href="#us-star" x="31.67"/><use href="#us-star" x="44.33"/><use href="#us-star" x="57.00"/><use href="#us-star" x="69.67"/>
    </g>
    <!-- Ряд из 5 звезд: смещение на полшага (12.67), шаг 12.67 -->
    <g id="star-row-5">
      <use href="#us-star" x="12.67"/><use href="#us-star" x="25.33"/><use href="#us-star" x="38.00"/><use href="#us-star" x="50.67"/><use href="#us-star" x="63.33"/>
    </g>
  </defs>
  <!-- Основной фон (красный) -->
  <rect width="190" height="100" fill="#B22234"/>
  <!-- Белые полосы (толщина каждой полосы 100/13 = 7.69) -->
  <path d="M0,7.69h190M0,23.08h190M0,38.46h190M0,53.85h190M0,69.23h190M0,84.62h190" stroke="#fff" stroke-width="7.69"/>
  <!-- Синий кантон (строго 76 на 53.85) -->
  <rect width="76" height="53.85" fill="#3C3B6E"/>
  <!-- Разметка рядов по вертикали: шаг 5.38 -->
  <use href="#star-row-6" y="5.38"/>
  <use href="#star-row-5" y="10.77"/>
  <use href="#star-row-6" y="16.15"/>
  <use href="#star-row-5" y="21.54"/>
  <use href="#star-row-6" y="26.92"/>
  <use href="#star-row-5" y="32.31"/>
  <use href="#star-row-6" y="37.69"/>
  <use href="#star-row-5" y="43.08"/>
  <use href="#star-row-6" y="48.46"/>
  <!-- Защитный контур -->
  <rect width="190" height="100" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="2"/>
</svg>
