<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <style>
      .label { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; text-anchor: middle; letter-spacing: 2px; }
      .dark-circle { fill: #000000; fill-opacity: 0.35; }
      .currency { font-family: 'DejaVu Sans', 'Segoe UI', Arial, sans-serif; font-size: 56px; font-weight: 900; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <!-- Карточка с флагом -->
  <rect x="10" y="10" width="220" height="140" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
  <!-- 13 полос -->
  <g>
    <rect x="10" y="10" width="220" height="10.77" fill="#B22234"/><rect x="10" y="20.77" width="220" height="10.77" fill="#fff"/>
    <rect x="10" y="31.54" width="220" height="10.77" fill="#B22234"/><rect x="10" y="42.31" width="220" height="10.77" fill="#fff"/>
    <rect x="10" y="53.08" width="220" height="10.77" fill="#B22234"/><rect x="10" y="63.85" width="220" height="10.77" fill="#fff"/>
    <rect x="10" y="74.62" width="220" height="10.77" fill="#B22234"/><rect x="10" y="85.39" width="220" height="10.77" fill="#fff"/>
    <rect x="10" y="96.16" width="220" height="10.77" fill="#B22234"/><rect x="10" y="106.93" width="220" height="10.77" fill="#fff"/>
    <rect x="10" y="117.70" width="220" height="10.77" fill="#B22234"/><rect x="10" y="128.47" width="220" height="10.77" fill="#fff"/>
    <rect x="10" y="139.24" width="220" height="10.76" fill="#B22234"/>
  </g>
  <!-- Синий прямоугольник со звёздами -->
  <rect x="10" y="10" width="88" height="55" fill="#3C3B6E"/>
  <circle cx="22" cy="18" r="1.5" fill="#fff"/><circle cx="30" cy="18" r="1.5" fill="#fff"/><circle cx="38" cy="18" r="1.5" fill="#fff"/>
  <circle cx="46" cy="18" r="1.5" fill="#fff"/><circle cx="54" cy="18" r="1.5" fill="#fff"/><circle cx="62" cy="18" r="1.5" fill="#fff"/>
  <circle cx="70" cy="18" r="1.5" fill="#fff"/><circle cx="78" cy="18" r="1.5" fill="#fff"/>
  <circle cx="26" cy="24" r="1.5" fill="#fff"/><circle cx="34" cy="24" r="1.5" fill="#fff"/><circle cx="42" cy="24" r="1.5" fill="#fff"/>
  <circle cx="50" cy="24" r="1.5" fill="#fff"/><circle cx="58" cy="24" r="1.5" fill="#fff"/><circle cx="66" cy="24" r="1.5" fill="#fff"/>
  <circle cx="74" cy="24" r="1.5" fill="#fff"/><circle cx="22" cy="30" r="1.5" fill="#fff"/><circle cx="30" cy="30" r="1.5" fill="#fff"/>
  <circle cx="38" cy="30" r="1.5" fill="#fff"/><circle cx="46" cy="30" r="1.5" fill="#fff"/><circle cx="54" cy="30" r="1.5" fill="#fff"/>
  <circle cx="62" cy="30" r="1.5" fill="#fff"/><circle cx="70" cy="30" r="1.5" fill="#fff"/><circle cx="78" cy="30" r="1.5" fill="#fff"/>
  <circle cx="26" cy="36" r="1.5" fill="#fff"/><circle cx="34" cy="36" r="1.5" fill="#fff"/><circle cx="42" cy="36" r="1.5" fill="#fff"/>
  <circle cx="50" cy="36" r="1.5" fill="#fff"/><circle cx="58" cy="36" r="1.5" fill="#fff"/><circle cx="66" cy="36" r="1.5" fill="#fff"/>
  <circle cx="74" cy="36" r="1.5" fill="#fff"/>
  <!-- Затемнённый круг -->
  <circle cx="120" cy="78" r="42" class="dark-circle"/>
  <text x="120" y="84" class="currency">$</text>
  <text x="120" y="135" class="label">USD</text>
</svg>
