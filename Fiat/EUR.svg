<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
<defs>
<filter id="shadow-eur" x="-5%" y="-5%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/></filter>
<clipPath id="clip-eur"><rect x="10" y="10" width="220" height="140" rx="14"/></clipPath>
<linearGradient id="folds-eur" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#000" stop-opacity="0.3"/><stop offset="15%" stop-color="#fff" stop-opacity="0.15"/><stop offset="35%" stop-color="#000" stop-opacity="0.25"/><stop offset="55%" stop-color="#fff" stop-opacity="0.1"/><stop offset="80%" stop-color="#000" stop-opacity="0.35"/><stop offset="100%" stop-color="#fff" stop-opacity="0.15"/>
</linearGradient>
<linearGradient id="vignette-eur" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0.1"/><stop offset="50%" stop-color="#000" stop-opacity="0.0"/><stop offset="100%" stop-color="#000" stop-opacity="0.4"/></linearGradient>
<polygon id="star" points="0,-7 2,-2.2 7,-2.2 3.2,0.8 4.4,6 0,3.6 -4.4,6 -3.2,0.8 -7,-2.2 -2,-2.2"/>
<style>.label{font-family:'DejaVu Sans',Arial,sans-serif;font-size:13px;font-weight:600;fill:#fff;text-anchor:middle;letter-spacing:2px}.dark-circle{fill:#000;fill-opacity:0.45}.currency{font-family:'DejaVu Sans','Segoe UI',Arial,sans-serif;font-size:56px;font-weight:900;fill:#fff;text-anchor:middle;dominant-baseline:central}</style>
</defs>
<g filter="url(#shadow-eur)">
<rect x="10" y="10" width="220" height="140" rx="14" fill="#003399"/>
<g clip-path="url(#clip-eur)">
<rect x="10" y="10" width="220" height="140" fill="#003399"/>
<g fill="#FFCC00" transform="translate(120, 78)">
<use href="#star" transform="translate(0, -60)"/>
<use href="#star" transform="translate(30, -52)"/>
<use href="#star" transform="translate(52, -30)"/>
<use href="#star" transform="translate(60, 0)"/>
<use href="#star" transform="translate(52, 30)"/>
<use href="#star" transform="translate(30, 52)"/>
<use href="#star" transform="translate(0, 60)"/>
<use href="#star" transform="translate(-30, 52)"/>
<use href="#star" transform="translate(-52, 30)"/>
<use href="#star" transform="translate(-60, 0)"/>
<use href="#star" transform="translate(-52, -30)"/>
<use href="#star" transform="translate(-30, -52)"/>
</g>
<rect x="10" y="10" width="220" height="140" fill="url(#folds-eur)"/>
<rect x="10" y="10" width="220" height="140" fill="url(#vignette-eur)"/>
</g>
<rect x="10" y="10" width="220" height="140" rx="14" fill="none" stroke="#cbd5e1" stroke-width="1"/>
</g>
<circle cx="120" cy="78" r="42" class="dark-circle"/>
<text x="120" y="84" class="currency">€</text>
<text x="120" y="135" class="label">EUR</text>
</svg>
