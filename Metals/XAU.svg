<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Circle (Coin) -->
    <defs>
        <linearGradient id="grad_au" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFFACD;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
        </linearGradient>
    </defs>
    <circle cx="50" cy="50" r="45" fill="url(#grad_au)" stroke="#B8860B" stroke-width="2" />
    <circle cx="50" cy="50" r="38" fill="none" stroke="#FFFACD" stroke-width="1" stroke-dasharray="2,2" />
    
    <!-- Metal Symbol Text -->
    <text x="50" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#B8860B" text-anchor="middle" dominant-baseline="middle">Au</text>
    
    <!-- Small Ticker Label -->
    <text x="50" y="75" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#B8860B" text-anchor="middle">XAU</text>
</svg>